name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Operating guide matches the served copy
        run: curl --fail --silent --show-error --location https://www.ambiguous.ai/skill.md | cmp - skills/ambiguous/SKILL.md
      - name: Plugin and marketplace validate
        run: |
          npm install --global @anthropic-ai/claude-code
          claude plugin validate --strict .
